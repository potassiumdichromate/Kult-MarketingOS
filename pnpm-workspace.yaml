packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 11 requires an explicit decision for every dependency that wants to run a
# postinstall script. Leaving any of these unanswered fails the install under
# CI=true, which is exactly what happens inside a Docker build.
allowBuilds:
  # Required: downloads the Prisma schema engine used by `migrate deploy`.
  '@prisma/engines': true
  prisma: true
  # Required: native binary for the bundler behind vitest and tsx.
  esbuild: true
  # Optional but wanted: native msgpack codec BullMQ uses for job payloads.
  msgpackr-extract: true

  # Declined. None of these are needed, and each one runs arbitrary code at
  # install time, so they stay off.
  '@reown/appkit': false   # wallet-connect UI pulled in transitively by Privy
  '@scarf/scarf': false    # install-time analytics
  bufferutil: false        # optional ws speedup; the JS path is fine
  utf-8-validate: false    # optional ws speedup; the JS path is fine
  keccak: false            # native hash addon; the JS fallback is used
