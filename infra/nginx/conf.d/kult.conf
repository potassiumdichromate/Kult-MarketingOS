##
# Site configuration.
#
# Replace `app.kult.games` and the certificate paths with the real values for
# the deployment. The API is served on its own hostname so browser CORS is a
# real boundary rather than a formality.
##

# Plain HTTP exists only to answer the ACME challenge and redirect.
server {
    listen 80;
    listen [::]:80;
    server_name app.kult.games api.kult.games;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# Web application
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.kult.games;

    ssl_certificate     /etc/nginx/certs/app.kult.games/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/app.kult.games/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS. Only safe once HTTPS is confirmed working on every subdomain that
    # will be covered by includeSubDomains.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # This is an internal tool and must not appear in search results.
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=web_limit burst=100 nodelay;
    limit_conn conn_limit 40;

    # Next.js build assets are immutable and content-hashed.
    location /_next/static/ {
        proxy_pass http://kult_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://kult_web;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id_final;

        # Upgrade headers are set so Next's dev websocket and any future
        # streaming route work without a second location block.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}

# ---------------------------------------------------------------------------
# API
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.kult.games;

    ssl_certificate     /etc/nginx/certs/api.kult.games/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/api.kult.games/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    limit_req zone=api_limit burst=40 nodelay;
    limit_conn conn_limit 20;

    # CORS is decided by the API against its own allowlist. nginx deliberately
    # does not add CORS headers: two sources of truth would eventually disagree.

    # Health and readiness are unauthenticated and must stay cheap, so they skip
    # the rate limiter that guards the rest of the API.
    location ~ ^/(health|ready)$ {
        proxy_pass http://kult_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    location / {
        proxy_pass http://kult_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id_final;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Copilot turns invoke a model and several tools, so the read timeout is
        # generous. Buffering is off so streamed responses reach the client as
        # they are produced rather than in one block at the end.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    180s;
        proxy_buffering       off;
        proxy_cache           off;
    }
}
