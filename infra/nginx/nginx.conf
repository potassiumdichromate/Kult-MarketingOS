##
# Kult Marketing OS - nginx
#
# Terminates TLS and routes to the web and API containers. Postgres and Redis
# are never proxied: they are reachable only on the internal compose network.
##

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Standard websocket/SSE upgrade handling: echo the Upgrade header when the
    # client asked for one, and close the connection otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # The request id is generated here when a client did not supply one, and is
    # forwarded to the API so a single request can be traced from the edge
    # through the queue to a provider response.
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    log_format json_combined escape=json
        '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_id":"$request_id_final",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    server_tokens   off;

    keepalive_timeout  65;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Caps the request body. Knowledge-base uploads are the largest legitimate
    # payload and the API itself limits those to 5 MB; 12 MB leaves headroom for
    # multipart overhead without allowing an unbounded upload.
    client_max_body_size 12m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Rate limiting at the edge, in front of the application's own limiter.
    # The API bucket is tighter because those calls do real work.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=web_limit:10m rate=60r/s;
    limit_req_status 429;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    upstream kult_web {
        server web:3000;
        keepalive 32;
    }

    upstream kult_api {
        server api:4000;
        keepalive 32;
    }

    include /etc/nginx/conf.d/*.conf;
}
